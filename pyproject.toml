[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mighty-c"
version = "0.1.0"
description = "A modern C-dialect compiler targeting LLVM IR"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
    "llvmlite>=0.41",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.scripts]
mighty-c = "mighty_c.main:main"

[tool.setuptools.packages.find]
where = ["."]
